name: Build And Release JDX Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build JDX Binary
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            packages: build-essential make binutils tar gzip coreutils findutils
            cross_prefix: ""
            artifact_name: jdx-linux-x86_64
            archive_name: jdx-linux-x86_64
          - target: linux-i686
            packages: build-essential make binutils g++-multilib tar gzip coreutils findutils
            cross_prefix: ""
            artifact_name: jdx-linux-i686
            archive_name: jdx-linux-i686
          - target: linux-arm64
            packages: build-essential make binutils g++-aarch64-linux-gnu tar gzip coreutils findutils
            cross_prefix: aarch64-linux-gnu-
            artifact_name: jdx-linux-arm64
            archive_name: jdx-linux-arm64
          - target: linux-armhf
            packages: build-essential make binutils g++-arm-linux-gnueabihf tar gzip coreutils findutils
            cross_prefix: arm-linux-gnueabihf-
            artifact_name: jdx-linux-armhf
            archive_name: jdx-linux-armhf
          - target: linux-riscv64
            packages: build-essential make binutils g++-riscv64-linux-gnu tar gzip coreutils findutils
            cross_prefix: riscv64-linux-gnu-
            artifact_name: jdx-linux-riscv64
            archive_name: jdx-linux-riscv64

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y ${{ matrix.packages }}

      - name: Build release
        run: make -j"$(nproc)" TARGET=${{ matrix.target }} BUILD=release CROSS_PREFIX=${{ matrix.cross_prefix }}

      - name: Saving binary to release folder
        run: |
          mkdir -p release
          tar -czf release/${{ matrix.archive_name }}.tar.gz -C build/${{ matrix.target }}/release jdx
          sha256sum release/${{ matrix.archive_name }}.tar.gz > release/${{ matrix.archive_name }}.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/

  publish:
    name: Publish Binary To GitHub Release Tags
    runs-on: ubuntu-latest
    
    needs: build
    permissions:
      contents: write

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Collect release files
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp -f {} release/ \;
          sha256sum release/*.tar.gz > release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.tar.gz
            release/*.sha256
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
