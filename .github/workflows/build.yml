name: Build And Release JDX Binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build JDX Binary
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            mode: linux
            packages: build-essential make binutils libasound2-dev tar gzip coreutils findutils
            cross_prefix: ""
            artifact_name: jdx-linux-x86_64
            archive_name: jdx-linux-x86_64
            binary_path: build/linux-x86_64/release/jdx

          - target: linux-i686
            mode: linux
            packages: build-essential make binutils libasound2-dev g++-multilib tar gzip coreutils findutils
            cross_prefix: ""
            artifact_name: jdx-linux-i686
            archive_name: jdx-linux-i686
            binary_path: build/linux-i686/release/jdx

          - target: linux-arm64
            mode: linux
            packages: build-essential make binutils libasound2-dev g++-aarch64-linux-gnu tar gzip coreutils findutils
            cross_prefix: aarch64-linux-gnu-
            artifact_name: jdx-linux-arm64
            archive_name: jdx-linux-arm64
            binary_path: build/linux-arm64/release/jdx

          - target: linux-armhf
            mode: linux
            packages: build-essential make binutils libasound2-dev g++-arm-linux-gnueabihf tar gzip coreutils findutils
            cross_prefix: arm-linux-gnueabihf-
            artifact_name: jdx-linux-armhf
            archive_name: jdx-linux-armhf
            binary_path: build/linux-armhf/release/jdx

          - target: linux-riscv64
            mode: linux
            packages: build-essential make binutils libasound2-dev g++-riscv64-linux-gnu tar gzip coreutils findutils
            cross_prefix: riscv64-linux-gnu-
            artifact_name: jdx-linux-riscv64
            archive_name: jdx-linux-riscv64
            binary_path: build/linux-riscv64/release/jdx

          - target: linux-powerpc64
            mode: linux
            packages: build-essential make binutils libasound2-dev g++-powerpc64-linux-gnu tar gzip coreutils findutils
            cross_prefix: powerpc64-linux-gnu-
            artifact_name: jdx-linux-powerpc64
            archive_name: jdx-linux-powerpc64
            binary_path: build/linux-powerpc64/release/jdx

          - target: android-arm
            mode: android
            abi: armeabi-v7a
            android_api: 21
            artifact_name: jdx-android-arm
            archive_name: jdx-android-arm
            binary_path: build/android-arm/release/jdx

          - target: android-arm64
            mode: android
            abi: arm64-v8a
            android_api: 21
            artifact_name: jdx-android-arm64
            archive_name: jdx-android-arm64
            binary_path: build/android-arm64/release/jdx

          - target: android-x86
            mode: android
            abi: x86
            android_api: 21
            artifact_name: jdx-android-x86
            archive_name: jdx-android-x86
            binary_path: build/android-x86/release/jdx

          - target: android-x86_64
            mode: android
            abi: x86_64
            android_api: 21
            artifact_name: jdx-android-x86_64
            archive_name: jdx-android-x86_64
            binary_path: build/android-x86_64/release/jdx

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.mode == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Android dependencies
        if: matrix.mode == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            binutils \
            tar \
            gzip \
            coreutils \
            findutils \
            wget \
            unzip \
            python3 \
            openjdk-17-jdk

      - name: Set up Android NDK
        if: matrix.mode == 'android'
        run: |
          NDK_VERSION="27.2.12479018"
          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_ZIP="commandlinetools-linux-11076708_latest.zip"

          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "ndk;$NDK_VERSION"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          if [ "${{ matrix.mode }}" = "android" ]; then
            case "${{ matrix.abi }}" in
              armeabi-v7a)
                TRIPLE="armv7a-linux-androideabi"
                ;;
              arm64-v8a)
                TRIPLE="aarch64-linux-android"
                ;;
              x86)
                TRIPLE="i686-linux-android"
                ;;
              x86_64)
                TRIPLE="x86_64-linux-android"
                ;;
              *)
                echo "Unsupported Android ABI: ${{ matrix.abi }}"
                exit 1
                ;;
            esac

            TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            API="${{ matrix.android_api }}"

            make -j"$(nproc)" build \
              TARGET=${{ matrix.target }} \
              BUILD=release \
              CC="$TOOLCHAIN/${TRIPLE}${API}-clang" \
              CXX="$TOOLCHAIN/${TRIPLE}${API}-clang++" \
              AR="$TOOLCHAIN/llvm-ar" \
              STRIP="$TOOLCHAIN/llvm-strip"
          else
            make -j"$(nproc)" build \
              TARGET=${{ matrix.target }} \
              BUILD=release \
              CROSS_PREFIX=${{ matrix.cross_prefix }}
          fi

      - name: Verify output exists
        run: |
          test -f "${{ matrix.binary_path }}"
          ls -lh "${{ matrix.binary_path }}"

      - name: Package binary
        run: |
          mkdir -p release
          tar -czf "release/${{ matrix.archive_name }}.tar.gz" \
            -C "$(dirname "${{ matrix.binary_path }}")" \
            "$(basename "${{ matrix.binary_path }}")"
          sha256sum "release/${{ matrix.archive_name }}.tar.gz" > "release/${{ matrix.archive_name }}.tar.gz.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/

  publish:
    name: Publish Binary To GitHub Release Tags
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Collect release files
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp -f {} release/ \;
          sha256sum release/*.tar.gz > release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.tar.gz
            release/*.sha256
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true